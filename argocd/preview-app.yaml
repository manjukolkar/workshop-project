apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: preview-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/manjukolkar/workshop-project.git
    targetRevision: main
    path: helm/preview-app

  destination:
    server: https://kubernetes.default.svc
    namespace: preview

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true