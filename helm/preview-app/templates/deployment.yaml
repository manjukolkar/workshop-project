apiVersion: apps/v1
kind: Deployment

metadata:
  name: preview-app

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: preview-app

  template:
    metadata:
      labels:
        app: preview-app

    spec:
      containers:
        - name: preview-app

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 3000

          env:
            - name: PR_NUMBER
              value: "{{ trimPrefix "pr-" .Release.Namespace }}"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
{{ toYaml .Values.resources | indent 12 }}