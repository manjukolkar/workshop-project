{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: preview-app

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:
          - path: /

            pathType: Prefix

            backend:
              service:
                name: preview-app

                port:
                  number: {{ .Values.service.port }}

{{- end }}