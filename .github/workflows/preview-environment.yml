name: Preview Environment

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: workshop-preview-app
  EKS_CLUSTER_NAME: workshop-eks

jobs:

  # ============================================================
  # BUILD AND PUSH IMAGE
  # ============================================================

  build-and-push:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    outputs:
      image_tag: pr-${{ github.event.pull_request.number }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # TEMPORARY OIDC DEBUG STEP
      # --------------------------------------------------------

      - name: Get GitHub OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("========== GITHUB OIDC CLAIMS ==========");
            console.log("iss:", payload.iss);
            console.log("sub:", payload.sub);
            console.log("aud:", payload.aud);
            console.log("repository:", payload.repository);
            console.log("repository_id:", payload.repository_id);
            console.log("repository_owner:", payload.repository_owner);
            console.log("repository_owner_id:", payload.repository_owner_id);
            console.log("event_name:", payload.event_name);
            console.log("ref:", payload.ref);
            console.log("base_ref:", payload.base_ref);
            console.log("head_ref:", payload.head_ref);
            console.log("========================================");

      # --------------------------------------------------------
      # AWS OIDC LOGIN
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # LOGIN TO ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # BUILD AND PUSH DOCKER IMAGE
      # --------------------------------------------------------

      - name: Build and Push Docker image
        env:
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./app

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  # ============================================================
  # DEPLOY PREVIEW ENVIRONMENT
  # ============================================================

  deploy-preview:

    needs: build-and-push

    if: github.event.action != 'closed'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS OIDC LOGIN
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # CONFIGURE KUBECTL
      # --------------------------------------------------------

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # --------------------------------------------------------
      # CREATE ARGO CD APPLICATION
      # --------------------------------------------------------

      - name: Create Preview Application
        run: |

          PR_NUMBER=${{ github.event.pull_request.number }}

          cat <<EOF | kubectl apply -f -

          apiVersion: argoproj.io/v1alpha1
          kind: Application

          metadata:
            name: preview-pr-$PR_NUMBER
            namespace: argocd

          spec:

            project: default

            source:

              repoURL: https://github.com/manjukolkar/workshop-project.git

              targetRevision: ${{ github.event.pull_request.head.sha }}

              path: helm/preview-app

              helm:

                parameters:

                  - name: prNumber
                    value: "$PR_NUMBER"

                  - name: image.tag
                    value: "pr-$PR_NUMBER"

                  - name: ingress.host
                    value: "pr-$PR_NUMBER.preview.example.com"

            destination:

              server: https://kubernetes.default.svc

              namespace: pr-$PR_NUMBER

            syncPolicy:

              automated:
                prune: true
                selfHeal: true

              syncOptions:
                - CreateNamespace=true

          EOF


  # ============================================================
  # CLEANUP PREVIEW ENVIRONMENT
  # ============================================================

  cleanup-preview:

    if: github.event.action == 'closed'

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # CONFIGURE KUBECTL
      # --------------------------------------------------------

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # --------------------------------------------------------
      # DELETE ARGO CD APPLICATION
      # --------------------------------------------------------

      - name: Delete Argo CD Application
        run: |

          PR_NUMBER=${{ github.event.pull_request.number }}

          kubectl delete application \
            preview-pr-$PR_NUMBER \
            -n argocd \
            --ignore-not-found

      # --------------------------------------------------------
      # DELETE PREVIEW NAMESPACE
      # --------------------------------------------------------

      - name: Delete Preview Namespace
        run: |

          PR_NUMBER=${{ github.event.pull_request.number }}

          kubectl delete namespace \
            pr-$PR_NUMBER \
            --ignore-not-found